name: Linear Release
description: |
  Link the issues referenced by commit messages in a git range to a Linear
  release. Two modes, selected by `release-prefix`:
    - `release-prefix` empty (sync mode): create/sync a Linear release named
      after `tag` via `releaseSyncByAccessKey` (needs `linear-access-key`).
    - `release-prefix` set (attach mode): find the most recently created
      hand-made release whose name starts with the prefix and whose stage type
      is `started` ("In progress"), and link the issues to it (needs
      `linear-api-key`). Fails when no such release exists.
  The base of the commit range is taken from `since-tag`, or discovered from
  local git history as the previous tag of the same family (see `since-tag`).
  Requires the caller to check out full history first
  (actions/checkout with `fetch-depth: 0`, which also fetches tags).

inputs:
  linear-access-key:
    description: Linear pipeline access key. Required in sync mode (`release-prefix` empty) for the release sync mutation; unused in attach mode.
    required: false
    default: ''
  linear-api-key:
    description: |
      Linear personal API key. Required in attach mode (`release-prefix` set):
      finds the target release and links issues (`issueToReleaseCreate`).
      Optional in sync mode, where it enables:
        - Filtering out issues already linked to another release (dedup).
        - Moving referenced issues to a `completed` workflow state (`mark-done`).
      The pipeline access key cannot perform these operations — it is scoped to
      `*ByAccessKey` mutations only. If omitted in sync mode, dedup and
      mark-done are skipped with a warning.
    required: false
    default: ''
  release-prefix:
    description: |
      Case-insensitive prefix of a hand-created Linear release name (e.g.
      `tapp`, `cor`). When set, the action attaches issues to the most recently
      created release whose name starts with this prefix and whose stage type
      is `started`, instead of creating a release named after `tag`.
    required: false
    default: ''
  gh-token:
    description: Unused. The previous tag is discovered from local git history; the input is kept so existing callers keep working.
    required: false
    default: ''
  tag:
    description: Git tag of this release (e.g. tapp-v1.2.3). Used to compute the commit range and, in sync mode, as the Linear release name and version.
    required: true
  since-tag:
    description: |
      Base of the commit range whose messages are scanned for issue IDs.
      Three modes:
        - Empty (tag-push runs where HEAD is the tag itself): the base is the
          previous tag of `tag`'s family (tapp-v2.10.1 -> tapp-v2.10.0)
          reachable from `commit`, found in local git history. Other tag
          families in the repo (exporter-v*, ...) are ignored.
        - Equal to `tag` (anchor mode, e.g. backend release/* push between
          tags): scans commits since that existing tag up to `commit`. In
          attach mode, when the in-progress Linear release has the same
          version as `tag` (the tag was already pushed), the base is instead
          the previous tag of the family, exactly as for a tag push.
        - Different from `tag`: explicit base for the range.
    required: false
    default: ''
  commit:
    description: Commit SHA recorded on the Linear release. Defaults to HEAD.
    required: false
    default: ''
  service-path:
    description: |
      Restrict the release to issues referenced by commits that changed files
      under this repo path (e.g. services/user), applied as a git pathspec per
      commit. No extra permissions needed (`pull-requests: read` is no longer
      required). Note: when set, merge commits are excluded by pathspec
      filtering, so tickets that appear only in a merge commit's message (or
      only in a PR title) are not seen. Leave empty to include every issue
      referenced in the range.
    required: false
    default: ''
  mark-done:
    description: Move linked issues to the team's first `completed` state. Already-done and canceled issues are skipped. Requires `linear-api-key`.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Link issues to Linear release
      shell: bash
      env:
        LINEAR_ACCESS_KEY: ${{ inputs.linear-access-key }}
        LINEAR_API_KEY: ${{ inputs.linear-api-key }}
        RELEASE_PREFIX: ${{ inputs.release-prefix }}
        TAG: ${{ inputs.tag }}
        SINCE_TAG: ${{ inputs.since-tag }}
        COMMIT_INPUT: ${{ inputs.commit }}
        MARK_DONE: ${{ inputs.mark-done }}
        SERVICE_PATH: ${{ inputs.service-path }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        [ -n "$TAG" ] || { echo "tag input required" >&2; exit 1; }

        # Mode is selected by release-prefix. `tag` is needed in both modes
        # (commit range), so it cannot be the switch.
        if [ -n "$RELEASE_PREFIX" ]; then
          MODE=attach
          [ -n "$LINEAR_API_KEY" ] || { echo "linear-api-key input required when release-prefix is set" >&2; exit 1; }
        else
          MODE=sync
          [ -n "$LINEAR_ACCESS_KEY" ] || { echo "linear-access-key input required when release-prefix is empty" >&2; exit 1; }
        fi

        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "ERROR: shallow clone. This action reads commit history from the local checkout;" >&2
          echo "use actions/checkout with 'fetch-depth: 0' before running it." >&2
          exit 1
        fi

        COMMIT="${COMMIT_INPUT:-$(git rev-parse HEAD)}"
        git rev-parse -q --verify "$COMMIT^{commit}" >/dev/null \
          || { echo "ERROR: commit '$COMMIT' not found in local history" >&2; exit 1; }

        # Pure helpers (normalize_service_path, extract_issue_ids,
        # pick_started_release, issue_release_status, tag_version,
        # tag_family_glob, previous_tag).
        source "$ACTION_PATH/filter.sh"

        release_id=""
        release_name=""
        if [ "$MODE" = attach ]; then
          # Resolve the target release before touching git so a missing release
          # is the first thing in the log. Releases are hand-created in Linear;
          # we take the newest one (by createdAt) whose name starts with the
          # prefix and whose stage type is `started` ("In progress" in the UI).
          # Archived releases are excluded by default.
          echo "=== Looking up in-progress Linear release with name prefix '$RELEASE_PREFIX' ==="
          releases_query='query Q($prefix: String!) { releases(filter: { name: { startsWithIgnoreCase: $prefix }, stage: { type: { eq: started } } }, first: 50) { nodes { id name url createdAt } } }'
          releases_resp=$(curl -fsS -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$releases_query" --arg prefix "$RELEASE_PREFIX" '{query:$q, variables:{prefix:$prefix}}')")
          if printf '%s' "$releases_resp" | jq -e '.errors' > /dev/null 2>&1; then
            echo "ERROR: Linear returned errors on release lookup:" >&2
            printf '%s' "$releases_resp" | jq -c '.errors' >&2
            exit 1
          fi
          release=$(printf '%s' "$releases_resp" | pick_started_release) || {
            echo "ERROR: no in-progress Linear release with name prefix '$RELEASE_PREFIX'. Create one in Linear (stage: In progress) and re-run." >&2
            exit 1
          }
          release_id=$(printf '%s' "$release" | jq -r '.id')
          release_name=$(printf '%s' "$release" | jq -r '.name')
          echo "Target release: $release_name ($(printf '%s' "$release" | jq -r '.url'))"
        fi

        if [ -n "$SINCE_TAG" ] && [ "$SINCE_TAG" != "$TAG" ]; then
          # Caller supplies the base explicitly.
          BASE="$SINCE_TAG"
        else
          # Tag-push run (since-tag empty) or anchor mode (since-tag == tag).
          # Which commits belong to the release depends on whether TAG is the
          # release being shipped or the last one already shipped:
          #   - tag push: TAG is being shipped -> commits since the previous
          #     tag of the same family.
          #   - anchor, in-progress Linear release newer than TAG (tapp-v2.10.2
          #     while TAG is tapp-v2.10.1): commits after TAG.
          #   - anchor, in-progress Linear release IS TAG (tag already pushed,
          #     release/* branch at or past it): commits since the previous
          #     tag, same as a tag push. Anchoring on TAG here gives an empty
          #     range and attaches nothing.
          # The previous tag is looked up in local git history, restricted to
          # TAG's family (tapp-v*, exporter-v*, ... coexist in these monorepos)
          # and to tags reachable from COMMIT. Deliberately not GitHub's
          # generate-notes API (it picks the latest published release of any
          # family) and not `git describe` (nearest tag by history is often
          # from another family).
          tag_ver=$(tag_version "$TAG") || {
            echo "ERROR: tag '$TAG' does not end with a version number (expected e.g. tapp-v1.2.3); pass since-tag explicitly" >&2
            exit 1
          }
          release_ver=""
          if [ -n "$release_name" ]; then
            release_ver=$(tag_version "$release_name" || true)
          fi
          if [ -n "$SINCE_TAG" ] && [ "$release_ver" != "$tag_ver" ]; then
            BASE="$SINCE_TAG"
            echo "Base: $BASE (anchor: commits after this existing tag)"
          else
            glob=$(tag_family_glob "$TAG")
            BASE=$(git tag --merged "$COMMIT" --list "$glob" | previous_tag "$TAG") || BASE=""
            if [ -n "$BASE" ]; then
              echo "Base: $BASE (previous $glob tag before $TAG reachable from $COMMIT)"
            else
              echo "No $glob tag before $TAG reachable from $COMMIT: first release of this family, scanning everything reachable from $COMMIT"
            fi
          fi
        fi

        if [ -n "$BASE" ]; then
          git rev-parse -q --verify "$BASE^{commit}" >/dev/null || {
            echo "ERROR: base ref '$BASE' not found locally. Ensure actions/checkout ran with 'fetch-depth: 0' (which also fetches tags)." >&2
            exit 1
          }
          range="$BASE..$COMMIT"
        else
          range="$COMMIT"
        fi

        log_args=("$range")
        if [ -n "$SERVICE_PATH" ]; then
          # Pathspec scoping: a commit is in scope only if it changed files
          # under SERVICE_PATH. Pathspec matching is component-wise, so
          # services/user never matches services/user2. Merge commits are
          # naturally excluded (they have no pathspec diff without -m). No API
          # calls and no `pull-requests: read` needed.
          pathspec="$(normalize_service_path "$SERVICE_PATH")"
          log_args+=(-- "$pathspec")
          echo "Scoping to commits that changed files under: $pathspec"
        fi

        echo "=== Commits in range $range ==="
        git log --oneline "${log_args[@]}"
        echo "==="

        # Extract issue IDs (e.g. TYP-1234) from the full message (subject +
        # body) of each commit in the range. PRs are rebase-merged, so the
        # individual commits — not PR titles — carry the identifiers
        # (convention: category[svc1,svc2] TYP-1234 TYP-1235 message). Without
        # service-path, merge-commit messages are scanned too; branch slugs
        # like janbatic/typ-2663-... yielding TYP-2663 is intended.
        # In sync mode we deliberately do NOT send pullRequestReferences:
        # Linear's GitHub integration auto-links each PR's issues onto the
        # synced release, which would re-tag already-released issues regardless
        # of any issueReferences filter below. Issues alone are sufficient.
        ids=$(git log --format=%B "${log_args[@]}" | extract_issue_ids)
        if [ -n "$ids" ]; then
          candidate_issues=$(printf '%s\n' "$ids" | jq -R . | jq -s .)
        else
          candidate_issues='[]'
        fi

        # Issues that end up on the release this run: in sync mode the ones
        # sent in the sync payload, in attach mode the ones linked (or already
        # on the target release). Also the input for mark-done.
        issues_tmp=$(mktemp)
        trap 'rm -f "$issues_tmp"' EXIT

        echo "Candidate issues from commits: $(printf '%s' "$candidate_issues" | jq -c .)"

        # When an issue's release membership cannot be determined: sync mode
        # keeps it (the sync mutation tolerates unknown issues, as before);
        # attach mode skips it (issueToReleaseCreate would fail anyway).
        keep_or_skip() {
          if [ "$MODE" = sync ]; then
            echo "  $1: $2, keeping"
            printf '%s\n' "$1" >> "$issues_tmp"
          else
            echo "  $1: $2, skipping"
          fi
        }

        # Each issue may only belong to one release, so issues already on
        # another release are skipped in both modes; re-runs are idempotent.
        # The `issue(id)` query needs a personal API key — pipeline access keys
        # are scoped to *ByAccessKey mutations and would silently return errors.
        if [ -n "$LINEAR_API_KEY" ]; then
          if [ "$MODE" = attach ]; then
            echo "=== Linking issues to release '$release_name' ==="
          else
            echo "=== Checking issues against existing releases ==="
          fi
          release_check_query='query Q($id: String!) { issue(id: $id) { id releases { nodes { id name } } } }'
          link_mutation='mutation M($issueId: String!, $releaseId: String!) { issueToReleaseCreate(input: { issueId: $issueId, releaseId: $releaseId }) { success } }'
          for issue_id in $(printf '%s' "$candidate_issues" | jq -r '.[]'); do
            info=$(curl -fsS -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "$release_check_query" --arg id "$issue_id" '{query:$q, variables:{id:$id}}')") \
              || { keep_or_skip "$issue_id" "release lookup HTTP error"; continue; }

            if printf '%s' "$info" | jq -e '.errors' > /dev/null 2>&1; then
              keep_or_skip "$issue_id" "Linear returned errors on release lookup: $(printf '%s' "$info" | jq -c '.errors')"
              continue
            fi

            if ! printf '%s' "$info" | jq -e '.data.issue' > /dev/null 2>&1; then
              keep_or_skip "$issue_id" "not found in Linear"
              continue
            fi

            # In sync mode release_id is empty, so "target" can never match.
            status=$(printf '%s' "$info" | issue_release_status "$release_id")
            case "$status" in
              target)
                echo "  $issue_id: already on this release"
                printf '%s\n' "$issue_id" >> "$issues_tmp"
                continue
                ;;
              other\ *)
                echo "  $issue_id: already on release(s) [${status#other }], skipping"
                continue
                ;;
            esac

            if [ "$MODE" = sync ]; then
              printf '%s\n' "$issue_id" >> "$issues_tmp"
              continue
            fi

            resp=$(curl -fsS -X POST https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg q "$link_mutation" --arg issueId "$issue_id" --arg releaseId "$release_id" '{query:$q, variables:{issueId:$issueId, releaseId:$releaseId}}')") \
              || { echo "  $issue_id: link HTTP error, continuing"; continue; }

            if [ "$(printf '%s' "$resp" | jq -r '.data.issueToReleaseCreate.success // false')" = "true" ]; then
              echo "  $issue_id: linked"
              printf '%s\n' "$issue_id" >> "$issues_tmp"
            else
              err=$(printf '%s' "$resp" | jq -c '.errors // .')
              echo "  $issue_id: link reported failure: $err"
            fi
          done

          if [ -s "$issues_tmp" ]; then
            issues=$(sort -u "$issues_tmp" | jq -R . | jq -s .)
          else
            issues='[]'
          fi
        else
          # Only reachable in sync mode (attach mode requires the API key).
          echo "linear-api-key not set — skipping release dedup. Issues may end up on multiple releases."
          issues="$candidate_issues"
        fi

        if [ "$MODE" = sync ]; then
          echo "Issues for sync: $(printf '%s' "$issues" | jq -c .)"

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          payload=$(jq -n \
            --arg tag "$TAG" --arg sha "$COMMIT" --arg owner "$owner" --arg repo "$repo" \
            --argjson issues "$issues" \
            '{
              query: "mutation Sync($input: ReleaseSyncInputBase!) { releaseSyncByAccessKey(input: $input) { success release { id name url version } } }",
              variables: {
                input: {
                  name: $tag,
                  version: $tag,
                  commitSha: $sha,
                  issueReferences: ($issues | map({identifier: ., commitSha: $sha})),
                  repository: { owner: $owner, name: $repo, provider: "github", url: ("https://github.com/" + $owner + "/" + $repo) }
                }
              }
            }')

          response=$(curl -fsS -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_ACCESS_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload")

          echo "=== Linear response ==="
          printf '%s' "$response" | jq .

          if printf '%s' "$response" | jq -e '.data.releaseSyncByAccessKey.success' > /dev/null 2>&1; then
            echo "Linear release '$TAG' synced successfully"
          else
            echo "Linear sync failed" >&2
            exit 1
          fi
        else
          echo "Issues on release '$release_name' from this run: $(printf '%s' "$issues" | jq -c .)"
        fi

        if [ "$MARK_DONE" != "true" ] || [ "$(printf '%s' "$issues" | jq 'length')" -eq 0 ]; then
          exit 0
        fi

        if [ -z "$LINEAR_API_KEY" ]; then
          echo "mark-done is enabled but linear-api-key is not set — skipping. Pipeline access keys cannot update issue state."
          exit 0
        fi

        echo "=== Marking referenced issues as Done ==="
        issue_query='query Q($id: String!) { issue(id: $id) { id identifier state { id type name } team { states(filter: { type: { eq: "completed" } }) { nodes { id name position } } } } }'
        issue_mutation='mutation M($id: String!, $stateId: String!) { issueUpdate(id: $id, input: { stateId: $stateId }) { success issue { identifier state { name } } } }'

        for issue_id in $(printf '%s' "$issues" | jq -r '.[]'); do
          info=$(curl -fsS -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$issue_query" --arg id "$issue_id" '{query:$q, variables:{id:$id}}')") \
            || { echo "  $issue_id: lookup HTTP error, skipping"; continue; }

          if printf '%s' "$info" | jq -e '.errors' > /dev/null 2>&1; then
            err=$(printf '%s' "$info" | jq -c '.errors')
            echo "  $issue_id: Linear returned errors on lookup: $err, skipping"
            continue
          fi

          cur_type=$(printf '%s' "$info" | jq -r '.data.issue.state.type // empty')
          cur_name=$(printf '%s' "$info" | jq -r '.data.issue.state.name // empty')
          if [ -z "$cur_type" ]; then
            echo "  $issue_id: not found in Linear, skipping"
            continue
          fi
          if [ "$cur_type" = "completed" ] || [ "$cur_type" = "canceled" ]; then
            echo "  $issue_id: already '$cur_name' ($cur_type), skipping"
            continue
          fi

          issue_uuid=$(printf '%s' "$info" | jq -r '.data.issue.id')
          done_id=$(printf '%s' "$info" | jq -r '[.data.issue.team.states.nodes[]?] | sort_by(.position) | .[0].id // empty')
          if [ -z "$done_id" ]; then
            echo "  $issue_id: team has no completed-type state, skipping"
            continue
          fi

          resp=$(curl -fsS -X POST https://api.linear.app/graphql \
            -H "Authorization: $LINEAR_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$issue_mutation" --arg id "$issue_uuid" --arg stateId "$done_id" '{query:$q, variables:{id:$id, stateId:$stateId}}')") \
            || { echo "  $issue_id: update HTTP error, continuing"; continue; }

          ok=$(printf '%s' "$resp" | jq -r '.data.issueUpdate.success // false')
          new_name=$(printf '%s' "$resp" | jq -r '.data.issueUpdate.issue.state.name // "?"')
          if [ "$ok" = "true" ]; then
            echo "  $issue_id: '$cur_name' -> '$new_name'"
          else
            err=$(printf '%s' "$resp" | jq -c '.errors // .')
            echo "  $issue_id: update reported failure: $err"
          fi
        done
