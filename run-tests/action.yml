name: 'Run Tests'
description: 'Runnning tests'
inputs:
  python-version:
    description: Input python version
    required: true
  uv-version:
    description: Input poetry version
    required: false
    default: "0.5.21"
  working-directory:
    description: Input working directory
    required: true
  test-args:
    description: Arguments added to pytest
    required: true
  coverage-report-path:
    description: Set path to save coverage report. If left empty no report will be saved
    required: false

runs:
  using: composite
  steps:
    - name: Install python dependencies
      uses: typless/actions/install-python-dependencies@v4.0
      with:
        python-version: ${{ inputs.python-version }}
        uv-version: ${{ inputs.uv-version }}
        working-directory: ${{ inputs.working-directory }}
        uv-install-arguments: --only-dev
    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run pytest ${{ inputs.test-args }}
    - name: Archive test results
      if: inputs.coverage-report-path != ''
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path:  ${{ inputs.coverage-report-path }}
        retention-days: 5
