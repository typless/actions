name: 'Code quality'
description: 'Checking code quality'
inputs:
  python-version:
    description: Input python version
    required: true
  poetry-version:
    description: Input poetry version
    required: false
    default: "1.5.1"
  aws-pypi-username:
    description: Input aws username to access aws pypi bucket
    required: true
  aws-pypi-password:
    description: Input aws password to access aws pypi bucket
    required: true
  working-directory:
    description: Input working directory
    required: true

runs:
  using: composite
  steps:
    - name: Install python dependencies
      uses: typless/actions/install-python-dependencies@v4.0
      with:
        python-version: ${{ inputs.python-version }}
        uv-version: ${{ inputs.poetry-version }}
        aws-pypi-username: ${{ inputs.aws-pypi-username }}
        aws-pypi-password: ${{ inputs.aws-pypi-password }}
        working-directory: ${{ inputs.working-directory }}
    - name: Run bandit
      shell: bash
      run: poetry run bandit -c pyproject.toml -r .
      working-directory:  ${{ inputs.working-directory }}
    - name: Run ruff check
      shell: bash
      run: poetry run ruff check
      working-directory:  ${{ inputs.working-directory }}
    - name: Run safety check
      shell: bash
      run: poetry run safety check
      working-directory:  ${{ inputs.working-directory }}
